name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run testbench
        run: |
          iverilog -o sim test/tb.v src/bcd7seg.v
          vvp sim | tee sim.log
          grep -q "TAT CA CA KIEM THU DAT" sim.log

  openlane:
    runs-on: ubuntu-latest
    needs: simulate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenLane
        run: pip install openlane
      - name: Run RTL-to-GDSII flow
        run: openlane --dockerized config.json
      - name: Show manufacturability result
        run: cat runs/*/final/metrics.json | grep -E "route__drc_errors|design__lvs_error__count|design__instance__count"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: openlane-results
          path: |
            runs/*/final/gds/
            runs/*/final/metrics.json
            runs/*/*yosys-synthesis/reports/
